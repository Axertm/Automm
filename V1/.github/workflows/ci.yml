name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (SQLite)
        run: npm test

      - name: Build
        run: npm run build

  postgres-compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: escrow
          POSTGRES_USER: escrow
          POSTGRES_PASSWORD: escrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escrow -d escrow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://escrow:escrow@localhost:5432/escrow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply Postgres migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Generate Postgres client
        run: npx prisma generate --schema=prisma/schema.prisma

      # Optional Postgres-provider compatibility pass — catches provider-specific
      # query differences (e.g. case sensitivity) before they hit production.
      # SQLite remains the fast default job above; this is the extra safety net.
      - name: Test against Postgres
        run: npx vitest run

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f docker/Dockerfile --target production -t escrow-bot:ci .
